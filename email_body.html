<html>
<head>
    <meta charset="UTF-8">
</head>

<body style="
    margin: 0;
    padding: 0;
    background-color: #f4f6f8;
    font-family: Arial, Helvetica, sans-serif;
">

    <table width="100%" cellpadding="0" cellspacing="0"
           style="padding: 30px 10px;">

        <tr>
            <td align="center">

                <table width="600"
                       cellpadding="0"
                       cellspacing="0"
                       style="
                           max-width: 600px;
                           width: 100%;
                           background-color: #ffffff;
                           border-radius: 10px;
                           overflow: hidden;
                           border: 1px solid #e5e7eb;
                       ">

                    <!-- Header -->
                    <tr>
                        <td style="
                            background-color: #111827;
                            padding: 25px 30px;
                            color: #ffffff;
                        ">

                            <div style="
                                font-size: 22px;
                                font-weight: bold;
                            ">
                                New Contact Request
                            </div>

                            <div style="
                                margin-top: 6px;
                                font-size: 13px;
                                color: #d1d5db;
                            ">
                                Portfolio Website
                            </div>

                        </td>
                    </tr>


                    <!-- Content -->
                    <tr>
                        <td style="padding: 30px;">

                            <div style="
                                font-size: 14px;
                                color: #6b7280;
                                margin-bottom: 20px;
                            ">
                                You have received a new message through
                                your portfolio contact form.
                            </div>


                            <!-- Email -->
                            <div style="margin-bottom: 22px;">

                                <div style="
                                    font-size: 12px;
                                    color: #6b7280;
                                    text-transform: uppercase;
                                    font-weight: bold;
                                    margin-bottom: 6px;
                                ">
                                    Email
                                </div>

                                <div style="
                                    font-size: 15px;
                                    color: #111827;
                                ">
                                    {email}
                                </div>

                            </div>


                            <!-- Contact -->
                            <div style="margin-bottom: 22px;">

                                <div style="
                                    font-size: 12px;
                                    color: #6b7280;
                                    text-transform: uppercase;
                                    font-weight: bold;
                                    margin-bottom: 6px;
                                ">
                                    Contact
                                </div>

                                <div style="
                                    font-size: 15px;
                                    color: #111827;
                                ">
                                    {contact}
                                </div>

                            </div>


                            <!-- Message -->
                            <div>

                                <div style="
                                    font-size: 12px;
                                    color: #6b7280;
                                    text-transform: uppercase;
                                    font-weight: bold;
                                    margin-bottom: 8px;
                                ">
                                    Message
                                </div>

                                <div style="
                                    background-color: #f9fafb;
                                    border-left: 4px solid #2563eb;
                                    padding: 15px;
                                    font-size: 15px;
                                    line-height: 1.6;
                                    color: #374151;
                                    border-radius: 4px;
                                ">
                                    {message}
                                </div>

                            </div>


                            <!-- Reply Button -->
                            <div style="
                                margin-top: 30px;
                                text-align: center;
                            ">

                                <a href="mailto:{email}"
                                   style="
                                       display: inline-block;
                                       background-color: #2563eb;
                                       color: #ffffff;
                                       text-decoration: none;
                                       padding: 12px 24px;
                                       border-radius: 6px;
                                       font-size: 14px;
                                       font-weight: bold;
                                   ">
                                    Reply to Visitor
                                </a>

                            </div>

                        </td>
                    </tr>


                    <!-- Footer -->
                    <tr>
                        <td style="
                            background-color: #f9fafb;
                            padding: 18px 30px;
                            text-align: center;
                            border-top: 1px solid #e5e7eb;
                        ">

                            <div style="
                                font-size: 12px;
                                color: #9ca3af;
                            ">
                                This message was sent from your
                                portfolio contact form.
                            </div>

                        </td>
                    </tr>

                </table>

            </td>
        </tr>

    </table>

</body>
</html>
