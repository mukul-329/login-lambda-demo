<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Me</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .contact-box {
            width: 400px;
            background: white;

            padding: 30px;

            border-radius: 12px;

            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
        }

        h2 {
            margin-top: 0;
            margin-bottom: 25px;
            text-align: center;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;

            padding: 12px;

            margin-bottom: 18px;

            border: 1px solid #ccc;
            border-radius: 6px;

            font-size: 14px;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        button {
            width: 100%;

            padding: 12px;

            border: none;
            border-radius: 6px;

            background: #2563eb;
            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        #message {
            margin-top: 15px;
            text-align: center;
        }
    </style>

</head>

<body>

<div class="contact-box">

    <h2>Contact Me</h2>

    <form id="contactForm">

        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            placeholder="your@email.com"
            required
        >


        <label for="contact">
            Contact Number
        </label>

        <input
            type="tel"
            id="contact"
            placeholder="+91 9876543210"
            required
        >


        <label for="message">
            Message
        </label>

        <textarea
            id="messageText"
            placeholder="Write your message..."
            required
        ></textarea>


        <button type="submit" id="submitButton">
            Send Message
        </button>

    </form>

    <div id="status"></div>

</div>


<script>

const API_URL =
    "API_URL";


document
    .getElementById("contactForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const email =
            document.getElementById("email").value;

        const contact =
            document.getElementById("contact").value;

        const message =
            document.getElementById("messageText").value;

        const button =
            document.getElementById("submitButton");

        const status =
            document.getElementById("status");


        button.disabled = true;

        button.innerText = "Sending...";

        status.innerText = "";


        try {

            const response = await fetch(API_URL, {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    email: email,

                    contact: contact,

                    message: message

                })

            });


            const result = await response.json();


            if (response.ok) {

                status.innerText =
                    "Message sent successfully!";

                document
                    .getElementById("contactForm")
                    .reset();

            } else {

                status.innerText =
                    result.message || "Something went wrong.";

            }


        } catch (error) {

            console.error(error);

            status.innerText =
                "Unable to send message.";

        }


        button.disabled = false;

        button.innerText = "Send Message";

    });

</script>

</body>

</html>
